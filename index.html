<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173f35"><title>Psalmen 1773 | Zangdashboard</title><style>
:root{font-family:system-ui,Segoe UI,Arial,sans-serif;color:#17362d;background:#f4f7f4}*{box-sizing:border-box}body{margin:0}header{background:#173f35;color:white;padding:28px max(18px,calc((100vw - 1140px)/2))}h1{font-size:clamp(25px,4vw,37px);margin:0}header p{margin:7px 0;color:#cde6da}main{max-width:1140px;margin:auto;padding:20px 15px 60px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.panel{background:white;border:1px solid #dbe5de;border-radius:15px;padding:17px}.stat strong{display:block;font-size:clamp(22px,3vw,33px)}.stat span{color:#5c7167;font-size:13px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.bar button,.bar input,.bar select{border:1px solid #cbd9d0;background:white;color:#17362d;border-radius:9px;padding:11px;font:inherit}.bar button{cursor:pointer}.bar button.active{background:#173f35;color:white}.bar input{flex:1;min-width:170px}.bar select{max-width:100%}.legend{display:flex;gap:18px;flex-wrap:wrap;margin:15px 0;color:#5c7167;font-size:13px}.dot{display:inline-block;width:13px;height:13px;border:1px solid #bdcec2;border-radius:3px;background:white;margin-right:5px;vertical-align:-2px}.dot.recent{background:#27815a;border-color:#27815a}.dot.mid{background:#8dcca2;border-color:#8dcca2}.dot.old{background:#d5eadb;border-color:#d5eadb}.notice{font-size:13px;line-height:1.5;background:#fff9e9;border:1px solid #e6d5a4;padding:13px;border-radius:10px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:12px}.ps{background:white;border:1px solid #dbe5de;border-radius:12px;padding:14px;cursor:pointer;text-align:left;color:inherit;font:inherit}.ps:hover,.ps:focus-visible{outline:2px solid #27815a}.ps h3{margin:0 0 9px;font-size:16px}.ps small{color:#64786c}.track{height:8px;border-radius:10px;background:#e5ebe7;overflow:hidden;margin:10px 0}.fill{height:100%;background:#27815a}.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px;margin-top:13px}.cell{border:1px solid #cbd9d0;background:white;border-radius:6px;min-height:35px;display:grid;place-items:center;font:inherit;font-size:13px;color:#344a3f}.cell.recent{background:#27815a;color:white;border-color:#27815a}.cell.mid{background:#8dcca2;color:#17362d;border-color:#8dcca2}.cell.old{background:#d5eadb;color:#17362d;border-color:#d5eadb}.cell:focus-visible{outline:3px solid #f5a623}.panel{margin-bottom:20px}.panel h2{margin:0 0 6px}.panel .back{border:0;background:none;text-decoration:underline;color:#173f35;padding:0;cursor:pointer;margin-bottom:13px}.detail{margin-top:12px;color:#52685c;font-size:14px;min-height:42px}.muted{color:#64786c}.hidden{display:none}footer{margin-top:30px;color:#60746a;font-size:12px}@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}.bar{gap:7px}.bar button{flex:1}.ps{min-width:0}}
</style></head><body><header><h1>Psalmen 1773</h1><p>Gezongen coupletten · Boskoop · overzicht per psalm en gezang</p></header><main><div id="stats" class="stats"></div><div class="bar"><button id="psbtn" class="active">150 Psalmen</button><button id="gebbtn">Enige Gezangen / overige</button><input id="search" placeholder="Zoek psalmnummer of gezang" aria-label="Zoeken"><select id="sort" aria-label="Sorteren"><option value="number">Op nummer / naam</option><option value="least">Minst gezongen eerst</option><option value="most">Meest gezongen eerst</option><option value="last">Laatst gezongen</option></select></div><div class="legend"><span><i class="dot"></i>Niet gezongen</span><span><i class="dot recent"></i>Afgelopen jaar</span><span><i class="dot mid"></i>1–2 jaar geleden</span><span><i class="dot old"></i>Meer dan 2 jaar geleden</span></div><section id="detail" class="panel hidden" aria-live="polite"></section><section id="grid" class="grid"></section><footer id="footer">Openbaar zijn uitsluitend aantallen en laatste zangdatums. Geen preekgegevens of individuele registraties.</footer></main><script>
const $=x=>document.getElementById(x);let source=null,tab='psalms',selected=null;const fmt=d=>d?new Date(d+'T12:00:00').toLocaleDateString('nl-NL'):'onbekend';const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function ageClass(last){
  if(!last || !/^\d{4}-\d{2}-\d{2}$/.test(last))return '';
  const today=new Date();today.setHours(0,0,0,0);
  const one=new Date(today);one.setFullYear(today.getFullYear()-1);
  const two=new Date(today);two.setFullYear(today.getFullYear()-2);
  const sung=new Date(last+'T12:00:00');
  return sung>=one?'recent':sung>=two?'mid':'old';
}
function statsFor(o){const vs=Object.keys(o).map(Number).filter(Number.isFinite),max=Math.max(0,...vs);return {unique:vs.length,max,occ:Object.values(o).reduce((a,v)=>a+v.count,0),last:Object.values(o).map(v=>v.last||'').sort().at(-1)||''}}
function render(){if(!source)return;const all=tab==='psalms'?Object.fromEntries(Array.from({length:150},(_,i)=>[i+1,source.psalms[String(i+1)]||{}])):source.hymns;const entries=Object.entries(all);const total=entries.reduce((a,[k,o])=>a+statsFor(o).unique,0),occ=entries.reduce((a,[k,o])=>a+statsFor(o).occ,0);$('stats').innerHTML=[['Psalmen / aanduidingen',entries.length],['Met registratie',entries.filter(([k,o])=>Object.keys(o).length).length],['Verschillende coupletten',total],['Keer gezongen',occ]].map(([t,n])=>`<div class="stat"><strong>${n.toLocaleString('nl-NL')}</strong><span>${t}</span></div>`).join('');$('psbtn').classList.toggle('active',tab==='psalms');$('gebbtn').classList.toggle('active',tab==='hymns');let q=$('search').value.toLowerCase().trim().replace(/^psalm\s*/,''),rows=entries.filter(([k])=>k.toLowerCase().includes(q));const sort=$('sort').value;rows.sort((a,b)=>sort==='number'?(tab==='psalms'?Number(a[0])-Number(b[0]):a[0].localeCompare(b[0],'nl')):sort==='least'?statsFor(a[1]).occ-statsFor(b[1]).occ:sort==='most'?statsFor(b[1]).occ-statsFor(a[1]).occ:statsFor(b[1]).last.localeCompare(statsFor(a[1]).last));$('grid').innerHTML=rows.map(([k,o])=>{const v=statsFor(o);return `<button class="ps" data-key="${safe(k)}"><h3>${tab==='psalms'?'Psalm ':''}${safe(k)}</h3><small>${v.unique} coupletten geregistreerd · ${v.occ} keer gezongen</small><div class="track"><div class="fill" style="width:${v.max?100*v.unique/v.max:0}%"></div></div><small>Laatste keer: ${fmt(v.last)}</small></button>`}).join('')||'<p>Geen resultaten.</p>';$('grid').querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=b.dataset.key;detail(all[selected]);window.scrollTo({top:0,behavior:'smooth'})});if(selected&&all[selected])detail(all[selected]);else $('detail').classList.add('hidden')}
function detail(o){const v=statsFor(o);$('detail').classList.remove('hidden');$('detail').innerHTML=`<button class="back" id="back">← Terug naar overzicht</button><h2>${tab==='psalms'?'Psalm ':''}${safe(selected)}</h2><p class="muted">${v.unique} verschillende coupletten · ${v.occ} keer gezongen · laatst ${fmt(v.last)}</p><div class="cells">${Array.from({length:v.max},(_,i)=>{const n=i+1,x=o[n];return `<button class="cell ${x?ageClass(x.last):''}" data-n="${n}" aria-label="Couplet ${n}${x?', '+x.count+' keer gezongen':' niet geregistreerd'}">${n}</button>`}).join('')}</div><div id="verseInfo" class="detail">Tik op een couplet voor de gegevens.</div>`;$('back').onclick=()=>{selected=null;$('detail').classList.add('hidden')};$('detail').querySelectorAll('.cell').forEach(b=>b.onclick=()=>{const n=b.dataset.n,x=o[n];$('verseInfo').textContent=x?`Couplet ${n}: ${x.count} keer gezongen · laatste keer ${fmt(x.last)}`:`Couplet ${n}: niet geregistreerd`})}
$('psbtn').onclick=()=>{tab='psalms';selected=null;render()};$('gebbtn').onclick=()=>{tab='hymns';selected=null;render()};$('search').oninput=render;$('sort').onchange=render;
fetch('data.json?ts='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(d=>{source=d;render()}).catch(e=>{$('grid').innerHTML='<p>Gegevens konden niet worden geladen. Open dit dashboard via een webserver of GitHub Pages (niet rechtstreeks als bestand).</p>'});
</script></body></html>
